name: Publish v0.1.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.1.1.yml]
  workflow_dispatch:

concurrency:
  group: publish-v0.1.1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # This workflow publishes only the approved v0.1.1 merge, never a later HEAD.
      RELEASE_COMMIT: 69d00471189d06d21ad6497f36975c05b3c3228b
      RELEASE_TAG: v0.1.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69d00471189d06d21ad6497f36975c05b3c3228b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate the approved source
        run: |
          python -m pip install build
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m build --wheel --outdir dist
      - name: Verify the wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --force-reinstall "$GITHUB_WORKSPACE/dist/research_radar-0.1.1-py3-none-any.whl"
          test "$(research-radar --version)" = '0.1.1'
          research-radar doctor
          research-radar demo --data-dir release-demo
      - name: Prepare checksums and release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import tomllib
          from research_radar import __version__
          assert __version__ == tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == '0.1.1'
          wheel = Path('dist/research_radar-0.1.1-py3-none-any.whl')
          Path('dist/SHA256SUMS.txt').write_text(hashlib.sha256(wheel.read_bytes()).hexdigest() + '  ' + wheel.name + '\n')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          notes = changelog.split('## 0.1.1 — 2026-10-08\n', 1)[1].split('\n## 0.1.0', 1)[0].strip()
          notes += '\n\n### 安装与验证\n\n下载下方 wheel 后运行：\n\n```bash\npython -m pip install research_radar-0.1.1-py3-none-any.whl\nresearch-radar doctor\nresearch-radar demo --data-dir demo-v0.1.1\n```\n\nPython 3.9+。两个 skill 和安装脚本包含在 Source code 源码包中；wheel 提供 Python CLI 和默认配置。SHA256SUMS.txt 用于校验安装包。\n\n93 项测试通过，安装包已在仓库外验收。审查与变更：https://github.com/zacksomething/research-radar/pull/1\n'
          Path('dist/RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PY
      - name: Publish the approved release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its tag or assets.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/research_radar-0.1.1-py3-none-any.whl dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title 'Research Radar v0.1.1' --notes-file dist/RELEASE_NOTES.md --latest
