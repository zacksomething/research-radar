[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "0.1.1"
description = "Evidence-aware paper discovery and research-team scouting, with local review workflows."
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
research-radar = "research_radar.__main__:main"

[tool.setuptools.packages.find]
include = ["research_radar*"]

[tool.setuptools.package-data]
research_radar = ["resources/*.yml", "resources/*.json"]
